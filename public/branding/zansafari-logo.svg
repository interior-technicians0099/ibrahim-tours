<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Double Circle Border -->
  <circle cx="250" cy="250" r="240" fill="#0f172a" stroke="url(#goldBorder)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="218" fill="#1e293b"/>

  <!-- Inner Sky & Sunset -->
  <clipPath id="innerCircleClip">
    <circle cx="250" cy="250" r="212"/>
  </clipPath>
  <g clip-path="url(#innerCircleClip)">
    <rect x="38" y="38" width="424" height="424" fill="url(#skyGrad)"/>
    
    <!-- Sun Rays -->
    <g opacity="0.3" stroke="#fff" stroke-width="3">
      <line x1="250" y1="260" x2="100" y2="90"/>
      <line x1="250" y1="260" x2="150" y2="70"/>
      <line x1="250" y1="260" x2="200" y2="55"/>
      <line x1="250" y1="260" x2="250" y2="50"/>
      <line x1="250" y1="260" x2="300" y2="55"/>
      <line x1="250" y1="260" x2="350" y2="70"/>
      <line x1="250" y1="260" x2="400" y2="90"/>
    </g>

    <!-- Sun Disc -->
    <circle cx="250" cy="260" r="55" fill="#fef08a" opacity="0.9"/>

    <!-- Acacia Tree Silhouette (Right) -->
    <path d="M 335 270 Q 340 230 350 200 Q 355 180 345 160 Q 320 155 295 158 Q 280 162 270 170 Q 285 180 320 178 Q 340 185 348 200 L 345 270 Z" fill="#0f172a"/>
    <ellipse cx="330" cy="155" rx="55" ry="14" fill="#0f172a"/>
    <ellipse cx="370" cy="162" rx="42" ry="11" fill="#0f172a"/>
    <ellipse cx="295" cy="165" rx="35" ry="9" fill="#0f172a"/>

    <!-- Ocean Horizon & Waves -->
    <rect x="38" y="260" width="424" height="202" fill="url(#seaGrad)"/>
    <path d="M 38 275 Q 100 265 170 275 T 310 275 T 450 275 L 462 462 L 38 462 Z" fill="#0284c7" opacity="0.5"/>
    <path d="M 38 290 Q 120 280 210 290 T 380 290 T 462 290 L 462 462 L 38 462 Z" fill="#0369a1" opacity="0.6"/>

    <!-- Zanzibari Dhow Boat (Left/Center) -->
    <g transform="translate(140, 195)">
      <!-- Main Triangular Lateen Sail -->
      <path d="M 50 15 L 105 130 L 10 120 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <path d="M 50 15 L 10 120" stroke="#94a3b8" stroke-width="2"/>
      <line x1="50" y1="15" x2="58" y2="128" stroke="#475569" stroke-width="2.5"/>
      
      <!-- Front Jib Sail -->
      <path d="M 55 35 L 90 125 L 60 125 Z" fill="#f1f5f9" opacity="0.85"/>

      <!-- Wooden Hull -->
      <path d="M -5 125 Q 40 145 105 138 Q 125 132 120 122 Q 60 120 -5 125 Z" fill="#78350f" stroke="#b45309" stroke-width="2"/>
      <path d="M 5 127 Q 45 138 95 133" stroke="#d97706" stroke-width="2" fill="none"/>
    </g>

    <!-- Spice / Clove Botanical Branches (Framing bottom) -->
    <g fill="#15803d" stroke="#166534" stroke-width="1">
      <!-- Left spice branch -->
      <path d="M 90 390 Q 120 370 140 330" stroke="#78350f" stroke-width="4" fill="none"/>
      <ellipse cx="105" cy="375" rx="14" ry="7" transform="rotate(-30 105 375)" fill="#22c55e"/>
      <ellipse cx="125" cy="355" rx="14" ry="7" transform="rotate(-15 125 355)" fill="#16a34a"/>
      <ellipse cx="138" cy="330" rx="12" ry="6" transform="rotate(20 138 330)" fill="#15803d"/>
      <!-- Cloves -->
      <circle cx="145" cy="320" r="4.5" fill="#991b1b"/>
      <circle cx="152" cy="326" r="4.5" fill="#7f1d1d"/>

      <!-- Right spice branch -->
      <path d="M 410 390 Q 380 370 360 330" stroke="#78350f" stroke-width="4" fill="none"/>
      <ellipse cx="395" cy="375" rx="14" ry="7" transform="rotate(30 395 375)" fill="#22c55e"/>
      <ellipse cx="375" cy="355" rx="14" ry="7" transform="rotate(15 375 355)" fill="#16a34a"/>
      <ellipse cx="362" cy="330" rx="12" ry="6" transform="rotate(-20 362 330)" fill="#15803d"/>
      <!-- Cloves -->
      <circle cx="355" cy="320" r="4.5" fill="#991b1b"/>
      <circle cx="348" cy="326" r="4.5" fill="#7f1d1d"/>
    </g>

    <!-- Bottom Banner Backdrop -->
    <path d="M 80 410 Q 250 435 420 410 L 410 460 Q 250 480 90 460 Z" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <text x="250" y="442" text-anchor="middle" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="16" fill="#fbbf24" letter-spacing="3">SPICE • CULTURE • WILDLIFE</text>
  </g>

  <!-- Curved Top Brand Header -->
  <path id="brandArch" d="M 80 250 A 175 175 0 0 1 420 250" fill="none"/>
  <text fill="#ffffff" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="5" filter="url(#shadow)">
    <textPath href="#brandArch" startOffset="50%" text-anchor="middle">
      ZANSAFARI HORIZON
    </textPath>
  </text>
</svg>
